x-logging-options: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '5'

services:
  # --- SPRING BOOT BACKEND SERVICE ---
  banhangviet-be:
    container_name: banhangviet-be
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Biến BE_IMAGE_NAME được truyền tự động từ script deploy.sh trên VPS
    image: ${BE_IMAGE_NAME:-ghcr.io/lean1835/banhangviet-be:latest}
    security_opt:
      - no-new-privileges:true
    ports:
      # Port mặc định 8080 (có thể đè qua file .env trên VPS: BE_PORT=8080)
      - '${BE_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:8080/actuator/health']
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 15s
    restart: always
    logging: *default-logging
    env_file: ./backend/.env
    networks:
      - shared_network

  # --- REACT FRONTEND SERVICE (NGINX) ---
  banhangviet-fe:
    container_name: banhangviet-fe
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FE_IMAGE_NAME:-ghcr.io/lean1835/banhangviet-fe:latest}
    security_opt:
      - no-new-privileges:true
    ports:
      # Port mặc định 80 (có thể đè qua file .env trên VPS: FE_PORT=80)
      - '${FE_PORT:-80}:80'
    depends_on:
      - banhangviet-be
    restart: always
    logging: *default-logging
    networks:
      - shared_network

networks:
  shared_network:
    external: true
    # Tên Docker network dùng chung trên VPS (mặc định default_network)
    name: ${DOCKER_NETWORK:-default_network}
