<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="100%" height="100%">
  <defs>
    <!-- Rounded clipping mask -->
    <clipPath id="roundedCardLight">
      <rect width="1000" height="170" rx="18" />
    </clipPath>

    <!-- Apple Light Mode Soft Ceramic / Sky Gradient Background -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Lightmode Deep Charcoal & Slate Metallic Shimmer -->
    <linearGradient id="charcoalShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#475569;#0f172a;#0f172a" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#334155">
        <animate attributeName="stop-color" values="#334155;#0f172a;#334155;#334155" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#475569;#0f172a;#0f172a" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <style>
      .brand-title-light {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 64px;
        letter-spacing: 6px;
      }
    </style>
  </defs>

  <g clip-path="url(#roundedCardLight)">
    <!-- Container Card -->
    <rect width="1000" height="170" fill="url(#bgLight)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Wave Layer 1: Back Ocean Wave (White Translucent) -->
    <path d="M 0 102 C 150 84 350 120 500 102 C 650 84 850 120 1000 102 C 1150 84 1350 120 1500 102 C 1650 84 1850 120 2000 102 L 2000 170 L 0 170 Z" fill="#ffffff" fill-opacity="0.45">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="12s" repeatCount="indefinite" />
    </path>

    <!-- Wave Layer 2: Middle Ocean Wave (White Semi-Opaque) -->
    <path d="M 0 116 C 125 130 375 98 500 116 C 625 130 875 98 1000 116 C 1125 130 1375 98 1500 116 C 1625 130 1875 98 2000 116 L 2000 170 L 0 170 Z" fill="#ffffff" fill-opacity="0.75">
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="8s" repeatCount="indefinite" />
    </path>

    <!-- Wave Layer 3: Front Ocean Wave (Crisp Pure White) -->
    <path d="M 0 130 C 150 118 350 142 500 130 C 650 118 850 142 1000 130 C 1150 118 1350 142 1500 130 C 1650 118 1850 142 2000 130 L 2000 170 L 0 170 Z" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Lightmode Typography: BÁN HÀNG VIỆT -->
    <text x="500" y="68" text-anchor="middle" dominant-baseline="middle" class="brand-title-light" fill="url(#charcoalShimmer)">
      BÁN HÀNG VIỆT
    </text>
  </g>
</svg>
