<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="100%" height="100%">
  <defs>
    <!-- Rounded clipping mask -->
    <clipPath id="roundedCardDark">
      <rect width="1000" height="170" rx="18" />
    </clipPath>

    <!-- Dark Slate Gradient Background -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="55%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#161f30" />
    </linearGradient>

    <!-- Apple Metallic Titanium Shimmer -->
    <linearGradient id="appleShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e8e93">
        <animate attributeName="stop-color" values="#8e8e93;#ffffff;#aeaeb2;#8e8e93" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#8e8e93;#ffffff;#ffffff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#aeaeb2">
        <animate attributeName="stop-color" values="#aeaeb2;#ffffff;#8e8e93;#aeaeb2" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <style>
      .brand-title-dark {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-weight: 800;
        font-size: 64px;
        letter-spacing: 6px;
      }
    </style>
  </defs>

  <g clip-path="url(#roundedCardDark)">
    <!-- Container Card -->
    <rect width="1000" height="170" fill="url(#bgDark)" stroke="#30363d" stroke-width="1.5" />

    <!-- Wave Layer 1: Moonlight Ocean Wave (White Translucent) -->
    <path d="M 0 102 C 150 84 350 120 500 102 C 650 84 850 120 1000 102 C 1150 84 1350 120 1500 102 C 1650 84 1850 120 2000 102 L 2000 170 L 0 170 Z" fill="#ffffff" fill-opacity="0.12">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="12s" repeatCount="indefinite" />
    </path>

    <!-- Wave Layer 2: Moonlight Ocean Wave (White Semi-Translucent) -->
    <path d="M 0 116 C 125 130 375 98 500 116 C 625 130 875 98 1000 116 C 1125 130 1375 98 1500 116 C 1625 130 1875 98 2000 116 L 2000 170 L 0 170 Z" fill="#ffffff" fill-opacity="0.25">
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="8s" repeatCount="indefinite" />
    </path>

    <!-- Wave Layer 3: Moonlight Ocean Wave Front (White Glow) -->
    <path d="M 0 130 C 150 118 350 142 500 130 C 650 118 850 142 1000 130 C 1150 118 1350 142 1500 130 C 1650 118 1850 142 2000 130 L 2000 170 L 0 170 Z" fill="#ffffff" fill-opacity="0.45">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Typography: BÁN HÀNG VIỆT -->
    <text x="500" y="68" text-anchor="middle" dominant-baseline="middle" class="brand-title-dark" fill="url(#appleShimmer)">
      BÁN HÀNG VIỆT
    </text>
  </g>
</svg>
