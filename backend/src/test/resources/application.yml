spring:
  application:
    name: sales-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:test}

app:
  jwt:
    secret: 9a4f2c8d3e1b7f0a5c8d2e4b6a1f3c5e7a9b0c2d4e6f8a0b1c3d5e7f9a1b3c5e
    expiration-ms: 86400000
  frontend-url: http://localhost:3000
  default-household-name: BanHangViet
