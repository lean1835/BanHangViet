server {
    listen 80;
    server_name banhangviet.io.vn www.banhangviet.io.vn localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Nén Gzip tối ưu
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache vĩnh viễn cho Static Assets được Vite tạo hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache cho hình ảnh, favicon, web font
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Không cache file index.html để đảm bảo người dùng luôn nhận cập nhật mới nhất
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # React Router SPA Client-Side Routing Fallback (KHÔNG bao giờ cache HTML để luôn tải bundle JS mới nhất)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy cho API Request chuyển sang Backend Container
    location /api/ {
        proxy_pass http://banhangviet-be:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name banhangviet.io.vn www.banhangviet.io.vn localhost;

    ssl_certificate /etc/letsencrypt/live/banhangviet.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/banhangviet.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
